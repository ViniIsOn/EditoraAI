plugins { id 'com.android.application' }

android {
    namespace 'com.vini.editoraai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vini.editoraai'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.4.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug {
            // Instala ao lado da v0.2; não exige desinstalar nem perder dados da anterior.
            applicationIdSuffix '.tipografia'
            manifestPlaceholders = [appLabel: 'EditoraAI TIPOGRAFIA']
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [appLabel: 'EditoraAI']
        }
    }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.47'
    def media3 = '1.8.0'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.media3:media3-transformer:$media3"
    implementation "androidx.media3:media3-effect:$media3"
}
